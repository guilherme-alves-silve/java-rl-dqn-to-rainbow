# Generated by AI
# Docker Compose for **Podman** (Podman Desktop).
# TODO translate
# A diferença para o docker-compose.yml: o Podman não usa `runtime: nvidia`,
# e sim o **CDI** (Container Device Interface) do nvidia-container-toolkit:
#
#   devices:
#     - nvidia.com/gpu=all
#
# Use:
#   podman compose -f docker-compose.podman.yml up --build
#   podman compose -f docker-compose.podman.yml run --rm train
#

services:
  train:
    build:
      context: .
      dockerfile: Dockerfile
    image: java-rl-dqn-to-rainbow:latest
    container_name: rl-train
    # CDI: expõe a GPU do host (requer o nvidia-ctk cdi generate na machine)
    devices:
      - nvidia.com/gpu=all
    working_dir: /build
    environment:
      JAVA_RL_SITE_PACKAGES: /opt/venv/lib/python3.12/site-packages
      MAIN_CLASS: br.com.guialves.rflr.execs.games.atari.AgentCNNRainbowDQNMain
      JAVA_OPTS: >-
        -Xmx24g
        -XX:+UseParallelGC
        -Dagent.framesLimit=2000000
        -Dagent.evaluateAt=500000
        -Dagent.evaluationEpisodes=100
        -Dagent.bufferCapacity=1000000
        -Dagent.saveModel=true
        -Dagent.records=true
    volumes:
      # o código: hot reload, sem rebuild
      - .:/build
      - ./output_models:/app/output_models
      - ./output_evaluations:/app/output_evaluations
      - ./docs:/app/docs
      - maven-cache:/root/.m2
    ipc: host
    shm_size: "4gb"
    command: >-
      mvn -o -q compile exec:java
      -Dexec.mainClass=br.com.guialves.rflr.execs.games.atari.AgentCNNRainbowDQNMain

  test:
    image: java-rl-dqn-to-rainbow:latest
    container_name: rl-test
    working_dir: /build
    environment:
      JAVA_RL_SITE_PACKAGES: /opt/venv/lib/python3.12/site-packages
    volumes:
      - .:/build
      - maven-cache:/root/.m2
    ipc: host
    shm_size: "2gb"
    command: mvn -o test

  test-retro:
    image: java-rl-dqn-to-rainbow:latest
    container_name: rl-test-retro
    working_dir: /build
    environment:
      JAVA_RL_SITE_PACKAGES: /opt/venv/lib/python3.12/site-packages
    volumes:
      - .:/build
      - maven-cache:/root/.m2
    ipc: host
    shm_size: "2gb"
    command: mvn -o -Dgroups=integration -DexcludedGroups= test

  train-cpu:
    image: java-rl-dqn-to-rainbow:latest
    container_name: rl-train-cpu
    working_dir: /build
    environment:
      JAVA_RL_SITE_PACKAGES: /opt/venv/lib/python3.12/site-packages
      MAIN_CLASS: br.com.guialves.rflr.execs.games.atari.AgentCNNRainbowDQNMain
      JAVA_OPTS: >-
        -Xmx8g
        -Dagent.framesLimit=200000
        -Dagent.evaluateAt=50000
        -Dagent.evaluationEpisodes=10
        -Dagent.numberOfEnvs=4
    volumes:
      - .:/build
      - ./output_models:/app/output_models
      - ./output_evaluations:/app/output_evaluations
      - ./docs:/app/docs
      - maven-cache:/root/.m2
    ipc: host
    shm_size: "2gb"
    command: >-
      mvn -o -q compile exec:java
      -Dexec.mainClass=br.com.guialves.rflr.execs.games.atari.AgentCNNRainbowDQNMain

volumes:
  maven-cache:
